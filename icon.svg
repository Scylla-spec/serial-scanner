<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1E293B" stroke-width="4" />

  <!-- Outer Target Frame -->
  <path d="M 120 180 L 120 130 A 20 20 0 0 1 140 110 L 190 110" fill="none" stroke="#60A5FA" stroke-width="16" stroke-linecap="round" />
  <path d="M 322 110 L 372 110 A 20 20 0 0 1 392 130 L 392 180" fill="none" stroke="#60A5FA" stroke-width="16" stroke-linecap="round" />
  <path d="M 392 332 L 392 382 A 20 20 0 0 1 372 402 L 322 402" fill="none" stroke="#60A5FA" stroke-width="16" stroke-linecap="round" />
  <path d="M 190 402 L 140 402 A 20 20 0 0 1 120 382 L 120 332" fill="none" stroke="#60A5FA" stroke-width="16" stroke-linecap="round" />

  <!-- Barcode Vertical Bars -->
  <rect x="156" y="160" width="16" height="192" rx="4" fill="#F8FAFC" />
  <rect x="188" y="160" width="8" height="192" rx="3" fill="#F8FAFC" />
  <rect x="210" y="160" width="28" height="192" rx="4" fill="#F8FAFC" />
  <rect x="252" y="160" width="12" height="192" rx="3" fill="#F8FAFC" />
  <rect x="278" y="160" width="22" height="192" rx="4" fill="#F8FAFC" />
  <rect x="314" y="160" width="10" height="192" rx="3" fill="#F8FAFC" />
  <rect x="338" y="160" width="18" height="192" rx="4" fill="#F8FAFC" />

  <!-- Laser Scanline with Glow -->
  <line x1="100" y1="256" x2="412" y2="256" stroke="url(#scanGrad)" stroke-width="14" filter="url(#laserGlow)" />
  <line x1="100" y1="256" x2="412" y2="256" stroke="#38BDF8" stroke-width="4" />
</svg>
